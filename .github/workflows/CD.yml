#Goal -  To deploy build images from CI steps once the CI workflow is succeded

name: CD

on:
  workflow_call: 
  
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Code checkout
        uses: actions/checkout@v7

      - name : Copy example env to main env
        run: cp .env.example .env

      - name: Login in to Docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy container with docker compose
        run: | 
          docker compose pull
          docker compose up -d
        

      
    
