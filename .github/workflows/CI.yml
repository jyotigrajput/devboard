#Goal - I want to lint, build,Test and push the code for frontend and backend and then push images to Dockerhub

name: CI

on:
  push: 
    branches: [advanced]


jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses : actions/checkout@v7

      - name: Setup node js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
        
      - name: Install npm package
        run: npm install

      - name: Run Linter
        run: npm run lint

      - name: Run Test
        run: npm run test
    

