#Goal - I want to lint, build,Test and push the code for frontend and backend and then push images to Dockerhub

name: CI

on:
  push: 
    branches: [advanced]


jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses : actions/checkout@v7

      - name: Setup node js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
        
      - name: Install npm package
        run: npm install  --legacy-peer-deps
        working-directory: frontend

      - name: Run Linter
        run: npm run lint
        working-directory: frontend
        
      - name: Run Test
        run: npm run test
        working-directory: frontend

      - name: Login in to Docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
  
      -  name: Docker build and push
         uses: docker/build-push-action@v7
         with:
          context: ./frontend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest
    
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup go lang
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
            
      - name: Run go linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64

      - name: Run Test
        run: go test
        working-directory: backend
        
      - name: Login in to Docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
  
      -  name: Docker build and push
         uses: docker/build-push-action@v7
         with:
          context: ./frontend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-backend:latest
  
  
  
   
